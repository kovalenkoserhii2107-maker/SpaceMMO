# Space Strategy MMO — деплой на Fly.io.
#
# Регион фиксирован во Франкфурте, потому что база Neon лежит в eu-central-1,
# а тик ходит в нее раз в секунду: машина за океаном добавила бы к каждому
# запросу сотню миллисекунд.

app = "spacemmo"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

# Ровно одна машина, и она никогда не спит.
#
# Это не экономия, а требование архитектуры: игровой цикл держит состояние
# командиров в памяти процесса и периодически сбрасывает его в базу. Второй
# экземпляр завел бы второй тик со своей копией баз, и они начали бы затирать
# друг друга — тот же случай, что описан в правиле 12 для отдельного скрипта.
# Поэтому автомасштабирование выключено целиком, а не ограничено сверху.
#
# Засыпать машине тоже нельзя: мир живет тиком, а не запросами игроков.
# На остановленной машине не идет добыча, не летят флоты и не ходят боты.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  # Socket.IO держит соединение открытым на все время сессии, поэтому лимит
  # считается по соединениям, а не по запросам в секунду.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
